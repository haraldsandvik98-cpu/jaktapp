const CFG_KEY='jaktlogg.supabase';let sb=null,sbUser=null;

function keyRole(k){if(/^sb_secret_/.test(k))return 'service_role';try{return JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role}catch(e){return /^sb_publishable_/.test(k)?'anon':null}}
function loadLib(){return window.supabase?Promise.resolve():new Promise((ok,err)=>{const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';t.onload=ok;t.onerror=()=>err(new Error('Kunne ikke laste supabase-js'));document.head.appendChild(t)})}
const isoToLocal=iso=>{const d=new Date(iso);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
const SupabaseStore={
 async list(){const{data,error}=await sb.from('entries').select('*').order('taken_at',{ascending:false});if(error)throw error;
  const paths=data.flatMap(r=>r.photos||[]),url={};
  if(paths.length){const{data:sig,error:e2}=await sb.storage.from('photos').createSignedUrls(paths,3600);if(e2)throw e2;sig.forEach(x=>url[x.path]=x.signedUrl)}
  return data.map(r=>({id:r.id,species:r.species,datetime:isoToLocal(r.taken_at),country:r.country==='SE'?'SE':'NO',...(r.animal_class?{klasse:r.animal_class}:{}),sted:r.sted||'',notes:r.notes||'',photos:(r.photos||[]).map(p=>url[p]).filter(Boolean),...(r.lat!=null?{lat:r.lat,lng:r.lng}:{})}))},
 async add(e){const id=crypto.randomUUID(),paths=[];
  for(const [i,p] of e.photos.entries()){const blob=await (await fetch(p)).blob(),path=`${sbUser.id}/${id}/${i+1}.jpg`;
   const{error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;paths.push(path)}
  const row={id,species:e.species,country:cty(e),animal_class:e.klasse||null,taken_at:new Date(e.datetime).toISOString(),sted:e.sted||null,lat:e.lat??null,lng:e.lng??null,notes:e.notes||null,photos:paths};let{error}=await sb.from('entries').insert(row);
  if(error&&/animal_class/i.test(error.message||'')){delete row.animal_class;({error}=await sb.from('entries').insert(row));if(!error)console.warn('Kolonnen animal_class mangler: kjør supabase/schema.sql på nytt')}
  if(error&&/country/i.test(error.message||'')){delete row.country;({error}=await sb.from('entries').insert(row));if(!error)console.warn('Kolonnen country mangler: kjør supabase/schema.sql på nytt')}
  if(error)throw error},
 async delete(id){const{data}=await sb.from('entries').select('photos').eq('id',id).single();
  if(data&&data.photos&&data.photos.length)await sb.storage.from('photos').remove(data.photos);
  const{error}=await sb.from('entries').delete().eq('id',id);if(error)throw error}};
let Store=LocalStore;
async function initBackend(){const c=cfg();sb=null;sbUser=null;Store=LocalStore;if(!c)return 'local';
 try{await loadLib();sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,detectSessionInUrl:true}});
  let booted=false;
  // Lytter registreres FØR getSession, så PASSWORD_RECOVERY fra lenken ikke går tapt under oppstart.
  sb.auth.onAuthStateChange((ev,sess)=>{const was=!!sbUser;sbUser=sess&&sess.user;Store=sbUser?SupabaseStore:LocalStore;
   if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;if(booted)setTimeout(renderRecovery,0);return}if(booted&&was!==!!sbUser&&!RECOVERY&&!IN_RECOVERY)setTab(tab)});
  const code=new URLSearchParams(location.search).get('code');
  if(code&&RECOVERY){try{const{error}=await sb.auth.exchangeCodeForSession(code);if(error)HASH_ERR=error}catch(e){HASH_ERR=e}}
  const{data}=await sb.auth.getSession();sbUser=data.session&&data.session.user;booted=true;
  if(sbUser){Store=SupabaseStore;return 'server'}return 'login'}catch(e){console.warn(e);return 'local'}}

async function loadShares(){if(!$('shlist'))return;const{data,error}=await sb.from('shares').select('token,created_at').eq('revoked',false).order('created_at',{ascending:false});
 if(error){$('shmsg').textContent=/shares|relation|schema/i.test(error.message||'')?'Deling er ikke satt opp ennå: kjør supabase/schema.sql på nytt.':errNo(error);$('shnew').disabled=true;return}
 $('shlist').innerHTML=(data||[]).map(r=>`<li><span>🔗 Lenke fra ${fmt(r.created_at)}</span><span><button class="btn sec" data-cp="${r.token}" style="padding:6px 10px;margin:0">Kopier</button> <button class="btn sec" data-rv="${r.token}" style="padding:6px 10px;margin:0">Trekk tilbake</button></span></li>`).join('')||'<li>Ingen aktive delingslenker.</li>';
 document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{$('shmsg').textContent=await copyTxt(shareUrl(b.dataset.cp))?'Lenken er kopiert. Send den til den du vil dele med.':'Kunne ikke kopiere.'});
 document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{if(!confirm('Trekke tilbake lenken? Den slutter å virke med en gang.'))return;const{error}=await sb.from('shares').update({revoked:true}).eq('token',b.dataset.rv);$('shmsg').textContent=error?errNo(error):'Lenken er trukket tilbake.';loadShares()})}
function bindShares(){if(!$('shnew'))return;$('shnew').onclick=async()=>{const{data,error}=await sb.from('shares').insert({}).select('token').single();if(error){$('shmsg').textContent=errNo(error);return}
 $('shmsg').textContent=await copyTxt(shareUrl(data.token))?'Ny lenke laget og kopiert.':'Ny lenke laget. Trykk «Kopier».';loadShares()};loadShares()}
const SHARE=(()=>{const m=location.hash.match(/^#del=([a-f0-9]{32,})~([A-Za-z0-9_-]+)$/);if(!m)return null;try{const[u,k]=ub64u(m[2]).split('|');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u)||!k||keyRole(k)==='service_role')return null;return{token:m[1],url:u,key:k}}catch(e){return null}})();
async function renderShared(){document.querySelector('nav')&&(document.querySelector('nav').style.display='none');
 $('view').innerHTML='<div class="empty">Laster delte fangster …</div>';
 try{await loadLib();const c=window.supabase.createClient(SHARE.url,SHARE.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const{data,error}=await c.rpc('shared_entries',{p_token:SHARE.token});if(error)throw error;
  const rows=data||[];const by={};rows.forEach(r=>{const k=r.species+(r.country==='SE'?' 🇸🇪':'');(by[k]=by[k]||[]).push(r)});
  $('view').innerHTML=`<div class="panel"><h2 style="margin-top:0">Delte fangster</h2><p style="color:var(--m);font-size:14px;margin:0">Kun visning. ${rows.length} fangst${rows.length===1?'':'er'}.</p></div>`+
   (rows.length?Object.keys(by).map(k=>`<h2>${esc(k)} <span class="cnt">${by[k].length}</span></h2><div class="grid">${by[k].map(r=>`<div class="card"><div class="ph"></div><div><b>${esc(r.species)}</b>${r.animal_class?`<small class="kl">${esc(r.animal_class)}</small>`:''}<small>${fmt(r.taken_at)}</small>${r.sted?`<div class="pin">📍 ${esc(r.sted)}</div>`:''}</div></div>`).join('')}</div>`).join(''):'<div class="empty">Ingen fangster å vise.</div>')}
 catch(e){$('view').innerHTML='<div class="empty">Lenken virker ikke lenger (trukket tilbake eller ugyldig).</div>'}}
async function renderSettings(){const n=(await LocalStore.list()).length;
 $('view').innerHTML=`<div class="panel"><h2 style="margin-top:0">Innstillinger</h2>
 ${SETUP?`<p class="muted" style="color:var(--m);font-size:14px;margin:0">Oppsett av server (kun for eieren). Verdiene lagres bare i denne nettleseren og vises aldri igjen.</p>
 <label>Project URL<input id="su" type="password" autocomplete="off" placeholder="https://xxxx.supabase.co"></label>
 <label>Anon / publishable key<input id="sk" type="password" autocomplete="off" placeholder="anon-nøkkel"></label>
 <div class="maprow"><button class="btn" id="ss" style="flex:1">Lagre</button>${cfg()?'<button class="btn sec" id="sx">Koble fra</button>':''}</div><p id="smsg" style="font-size:14px;color:var(--m)"></p>`:`<p style="color:var(--m);font-size:14px;margin:0">${cfg()?'Koblet til privat lagring.':'Fangster lagres kun på denne enheten.'}</p>`}</div>
 <div class="panel" style="margin-top:14px"><h2 style="margin-top:0">Konto</h2><p style="color:var(--m);font-size:14px;margin:0 0 10px">${modeText()}</p>
 ${!cfg()?'':sbUser?`<form id="spf" style="margin-bottom:10px"><label>Sett passord (for innlogging uten e-postlenke)<input id="sp1" type="password" minlength="6" required autocomplete="new-password" placeholder="Nytt passord, minst 6 tegn"></label><input id="sp2" type="password" minlength="6" required autocomplete="new-password" placeholder="Gjenta passord" style="margin-top:6px"><button class="btn" style="margin-top:8px">Sett passord</button><p id="spm" style="font-size:14px;color:var(--m)"></p></form><button class="btn sec" id="lo">Logg ut</button><div class="sharebox"><h3 style="margin:0 0 4px;font-size:16px">Del fangster</h3><p style="color:var(--m);font-size:13px;margin:0">Lag en lenke som lar andre <b>se</b> fangstene dine (art, kjønn/alder, dato, sted). Ikke kartposisjon, notater eller bilder. Kan trekkes tilbake når som helst.</p><button class="btn" id="shnew" style="margin-top:8px">Lag delingslenke</button><ul id="shlist"></ul><p id="shmsg" style="font-size:13px;color:var(--m)"></p></div>${n?`<button class="btn" id="mig" style="margin-top:8px">Flytt lokale fangster til server (${n})</button>`:''}<p id="mmsg" style="font-size:14px;color:var(--m)"></p>`:'<button class="btn" id="li">Logg inn</button>'}</div>`;
 if($('ss'))$('ss').onclick=async()=>{const url=$('su').value.trim().replace(/\/+$/,'').replace(/\/(rest|auth|storage)\/v1.*$/i,'').replace(/\/+$/,''),key=$('sk').value.trim();
  if(!/^https:\/\/.+/.test(url)||!key){$('smsg').textContent='Fyll inn både URL og nøkkel.';return}
  if(keyRole(key)==='service_role'){$('smsg').textContent='Dette er en service_role/secret-nøkkel. Den skal aldri brukes i appen. Bruk anon-nøkkelen.';return}
  localStorage.setItem(CFG_KEY,JSON.stringify({url,key}));const m=await initBackend();$('hsub').textContent=modeText();if(m!=='local'&&(RECOVERY||/type=recovery/.test(location.hash)))return renderRecovery();$('smsg').textContent=m==='local'?'Kunne ikke koble til. Sjekk URL og nøkkel.':'Lagret.';if(m==='login')renderLogin();else renderSettings()};
 if($('sx'))$('sx').onclick=async()=>{if(sb)await sb.auth.signOut().catch(()=>{});localStorage.removeItem(CFG_KEY);await initBackend();renderSettings();$('hsub').textContent=modeText()};
 if($('li'))$('li').onclick=()=>renderLogin();
 if($('spf'))$('spf').onsubmit=async ev=>{ev.preventDefault();const a=$('sp1').value;if(a.length<6)return $('spm').textContent='Passordet må ha minst 6 tegn.';if(a!==$('sp2').value)return $('spm').textContent='Passordene er ikke like.';$('spm').textContent='Lagrer …';const{error}=await sb.auth.updateUser({password:a});$('spm').textContent=error?errNo(error):'Passordet er satt. Du kan nå logge inn med e-post og passord.';if(!error)$('spf').reset()};
 if(sbUser)bindShares();
 if($('lo'))$('lo').onclick=async()=>{await sb.auth.signOut();sbUser=null;Store=LocalStore;renderSettings();$('hsub').textContent=modeText()};
 if($('mig'))$('mig').onclick=async()=>{if(!confirm(`Flytte ${n} lokale fangster til serveren? De slettes fra enheten når de er lastet opp.`))return;
  const list=await LocalStore.list();let ok=0;for(const e of list){try{$('mmsg').textContent=`Laster opp ${ok+1} av ${list.length} …`;await SupabaseStore.add(e);await LocalStore.delete(e.id);ok++}catch(err){$('mmsg').textContent=`Stoppet etter ${ok}: ${err.message}`;return}}
  $('mmsg').textContent=`Ferdig: ${ok} fangster flyttet.`;setTimeout(renderSettings,1200)};
 $('hsub').textContent=modeText();scrollTo(0,0)}

const PAGE_URL=location.origin+location.pathname.replace(/[^/]*\.html?$/i,'').replace(/\/?$/,'/'); // app-rot, f.eks. https://haraldsandvik98-cpu.github.io/jaktapp/ (ingen egen /reset-password-rute)
// Skjult oppsett: Supabase-feltene vises kun med #oppsett i adressen (aldri for vanlige besøkende)
const SETUP=/^#oppsett$/.test(location.hash)||/[?&]oppsett(=|&|$)/.test(location.search);
let HASH_ERR=(()=>{const q=new URLSearchParams(location.hash.slice(1)+'&'+location.search.slice(1));const d=q.get('error_description')||q.get('error');if(d){history.replaceState(null,'',PAGE_URL)}return d?{message:d.replace(/\+/g,' '),code:q.get('error_code')||''}:null})();
const URLP=new URLSearchParams(location.hash.replace(/^#/,'')+'&'+location.search.replace(/^\?/,''));let RECOVERY=URLP.get('type')==='recovery'||URLP.get('rk')==='1',IN_RECOVERY=false;
const cleanUrl=()=>{if(location.hash||location.search)history.replaceState(null,'',PAGE_URL)};
function errNo(e){if(!e)return '';const m=((e.code||'')+' '+(e.message||e)).toLowerCase();
 if(/rate.?limit|over_email_send_rate|too many/.test(m))return 'For mange e-poster, vent en time eller bruk passord.';
 if(/invalid.?(login|credentials)|invalid_credentials/.test(m))return 'Feil e-post eller passord.';
 if(/not.?confirmed|email_not_confirmed/.test(m))return 'E-posten er ikke bekreftet ennå. Trykk på lenken i bekreftelses-e-posten, eller slå av «Confirm email» i Supabase (Authentication → Providers → Email).';
 if(/already.?(registered|exists)|user_already_exists|email_exists/.test(m))return 'Det finnes allerede en bruker med denne e-posten. Logg inn med passord, eller bruk «Glemt passord».';
 if(/otp_expired|expired|invalid.*link|access_denied/.test(m))return 'Lenken er utløpt eller ugyldig. Logg inn med passord, eller be om en ny lenke.';
 if(/weak|at least 6|password should/.test(m))return 'Passordet er for svakt (minst 6 tegn).';
 if(/same_password|different from the old/.test(m))return 'Det nye passordet må være forskjellig fra det gamle.';
 if(/signup.*disabled|signups not allowed/.test(m))return 'Nye brukere er slått av i Supabase-prosjektet.';
 if(/failed to fetch|network/.test(m))return 'Fikk ikke kontakt med serveren. Sjekk nettet.';
 return 'Feil: '+(e.message||e)}
const P=(id,t)=>`<p id="${id}" style="font-size:14px;color:var(--m)">${t||''}</p>`;
function renderLogin(mode,msg){mode=mode||'pw';if(!msg&&HASH_ERR){msg=errNo(HASH_ERR);HASH_ERR=null}
 const tabs=`<div class="seg" style="margin:10px 0 4px"><button type="button" id="mpw" class="${mode==='pw'?'on':''}">Logg inn med passord</button><button type="button" id="msu" class="${mode==='su'?'on':''}">Ny bruker? Opprett konto</button></div>`;
 let body='';
 if(mode==='pw')body=`<form id="lf"><label>E-post<input id="em" type="email" required placeholder="navn@eksempel.no" autocomplete="email"></label>
 <label>Passord<input id="pw" type="password" required autocomplete="current-password" placeholder="Passord"></label>
 <button class="btn" style="margin-top:14px">Logg inn</button></form>
 <p class="lk" style="font-size:14px;margin:12px 0 0;line-height:1.9"><a href="#" id="fg">Glemt passord?</a><br><a href="#" id="ml">Send innloggingslenke i stedet</a></p>`;
 else if(mode==='su')body=`<form id="lf"><label>E-post<input id="em" type="email" required placeholder="navn@eksempel.no" autocomplete="email"></label>
 <label>Passord (minst 6 tegn)<input id="pw" type="password" required minlength="6" autocomplete="new-password"></label>
 <label>Gjenta passord<input id="pw2" type="password" required minlength="6" autocomplete="new-password"></label>
 <button class="btn" style="margin-top:14px">Opprett konto</button></form>
 <p style="font-size:13px;color:var(--m);margin:10px 0 0">Kontoen opprettes i ditt eget Supabase-prosjekt. Er «Confirm email» på, må e-posten bekreftes én gang.</p>`;
 else if(mode==='fg')body=`<form id="lf"><p style="font-size:14px;color:var(--m);margin:6px 0 0">Vi sender en lenke for å velge nytt passord.</p><label>E-post<input id="em" type="email" required placeholder="navn@eksempel.no" autocomplete="email"></label>
 <button class="btn" style="margin-top:14px">Send lenke for nytt passord</button></form><p class="lk" style="font-size:14px;margin:10px 0 0"><a href="#" id="bk">← Tilbake til innlogging</a></p>`;
 else body=`<form id="lf"><p style="font-size:14px;color:var(--m);margin:6px 0 0">Du får en innloggingslenke på e-post. Supabase begrenser hvor mange e-poster som kan sendes per time.</p><label>E-post<input id="em" type="email" required placeholder="navn@eksempel.no" autocomplete="email"></label>
 <button class="btn" style="margin-top:14px">Send innloggingslenke</button></form><p class="lk" style="font-size:14px;margin:10px 0 0"><a href="#" id="bk">← Logg inn med passord</a></p>`;
 $('view').innerHTML=`<div class="panel"><h2 style="margin-top:0">${mode==='su'?'Opprett konto':mode==='fg'?'Glemt passord':'Logg inn'}</h2>
 <p style="color:var(--m);font-size:14px;margin:0">Fangstene dine er private og bare synlige for deg.</p>${mode==='pw'||mode==='su'?tabs:''}${body}${P('lmsg',msg)}
 <button class="btn sec" id="lb" style="margin-top:6px">Fortsett uten innlogging (kun på denne enheten)</button></div>`;
 const go=(m)=>e=>{e&&e.preventDefault();renderLogin(m)};
 if($('mpw'))$('mpw').onclick=go('pw');if($('msu'))$('msu').onclick=go('su');if($('fg'))$('fg').onclick=go('fg');if($('ml'))$('ml').onclick=go('ml');if($('bk'))$('bk').onclick=go('pw');
 $('lb').onclick=()=>setTab('arter');
 const say=t=>$('lmsg').textContent=t;
 $('lf').onsubmit=async ev=>{ev.preventDefault();if(!sb){say('Supabase er ikke satt opp under Innstillinger.');return}
  const email=$('em').value.trim(),btn=$('lf').querySelector('button');btn.disabled=true;say('Vent …');
  try{
   if(mode==='pw'){const{error}=await sb.auth.signInWithPassword({email,password:$('pw').value});if(error)return say(errNo(error));sbUser=(await sb.auth.getUser()).data.user;Store=SupabaseStore;$('hsub').textContent=modeText();setTab('arter')}
   else if(mode==='su'){const pw=$('pw').value;if(pw.length<6)return say('Passordet må ha minst 6 tegn.');if(pw!==$('pw2').value)return say('Passordene er ikke like.');
    const{data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:PAGE_URL}});if(error)return say(errNo(error));
    if(data.session){sbUser=data.session.user;Store=SupabaseStore;$('hsub').textContent=modeText();setTab('arter')}
    else if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)say(errNo({code:'user_already_exists'}));
    else say('Kontoen er opprettet, men «Confirm email» er på i Supabase. Bekreft én gang via lenken i e-posten, og logg deretter inn med passord. For en personlig app kan du i stedet slå av «Confirm email» under Authentication → Providers → Email.')}
   else if(mode==='fg'){const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:PAGE_URL});say(error?errNo(error):'Sjekk e-posten din og trykk på lenken for å velge nytt passord.')}
   else{const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:PAGE_URL}});say(error?errNo(error):'Sjekk e-posten din og trykk på lenken for å logge inn.')}
  }finally{btn.disabled=false}};scrollTo(0,0)}
function renderRecovery(){RECOVERY=false;IN_RECOVERY=true;if(sb)cleanUrl();tab='inn';['arter','ar','inn'].forEach(x=>$('t-'+x).classList.toggle('on',x==='inn'));
 if(!sb){$('view').innerHTML=`<div class="panel"><h2 style="margin-top:0">Sett nytt passord</h2><p class="muted" style="color:var(--m)">Lenken ble åpnet i en nettleser der appen ikke er koblet til Supabase. Åpne lenken i samme nettleser som du bruker appen i (ikke e-post-appens innebygde nettleser).</p><button class="btn" id="rgo">Til appen</button></div>`;$('rgo').onclick=()=>{IN_RECOVERY=false;setTab('inn')};return}
 if(!sbUser){const m=HASH_ERR?errNo(HASH_ERR):'Lenken er utløpt eller allerede brukt.';HASH_ERR=null;IN_RECOVERY=false;return renderLogin('fg',m+' Be om en ny lenke under.')}
 $('view').innerHTML=`<div class="panel"><h2 style="margin-top:0">Sett nytt passord</h2><p style="color:var(--m);font-size:14px;margin:0 0 6px">For ${esc(sbUser.email||'')}</p><form id="rf">
 <label>Nytt passord (minst 6 tegn)<input id="np" type="password" required minlength="6" autocomplete="new-password"></label>
 <label>Gjenta nytt passord<input id="np2" type="password" required minlength="6" autocomplete="new-password"></label>
 <button class="btn" id="rsave" style="margin-top:14px">Lagre nytt passord</button></form>${P('rmsg')}</div>`;
 $('rf').onsubmit=async ev=>{ev.preventDefault();const pw=$('np').value;if(pw.length<6)return $('rmsg').textContent='Passordet må ha minst 6 tegn.';if(pw!==$('np2').value)return $('rmsg').textContent='Passordene er ikke like.';
  $('rsave').disabled=true;$('rmsg').textContent='Lagrer …';const{error}=await sb.auth.updateUser({password:pw});$('rsave').disabled=false;
  if(error){const m=error.message||'';return $('rmsg').textContent=/same|different from the old/i.test(m)?'Det nye passordet må være forskjellig fra det gamle.':/weak|short|characters/i.test(m)?'Passordet er for svakt. Velg et lengre passord.':/expired|invalid|session|jwt|not authenticated/i.test(m)?'Lenken er utløpt. Be om en ny under «Glemt passord?».':errNo(error)}
  // Valgt UX: logg ut recovery-økten og gå til innlogging, så brukeren bekrefter det nye passordet.
  $('rmsg').textContent='✅ Passordet er lagret. Logg inn med det nye passordet.';const em=sbUser&&sbUser.email;
  setTimeout(async()=>{try{await sb.auth.signOut({scope:'local'})}catch(e){}sbUser=null;Store=LocalStore;IN_RECOVERY=false;$('hsub').textContent=modeText();renderLogin('pw','✅ Passordet er lagret. Logg inn med det nye passordet.');if(em&&$('em'))$('em').value=em},1500)};scrollTo(0,0)}

$('t-inn').onclick=()=>setTab('inn');$('cr').onclick=e=>{e.preventDefault();showCredits()};
(async()=>{if(SHARE)return renderShared();await LocalStore.migrate();const m=await initBackend();$('hsub').textContent=modeText();if(RECOVERY&&m!=='local'||RECOVERY&&!cfg())return renderRecovery();if(HASH_ERR||/access_token|[?&]code=/.test(location.hash+location.search))setTimeout(cleanUrl,0);if(HASH_ERR&&m!=='login'){const t=errNo(HASH_ERR);HASH_ERR=null;setTimeout(()=>alert(t),300)}SETUP?setTab('inn'):m==='login'?(tab='inn',['arter','ar','inn'].forEach(x=>$('t-'+x).classList.toggle('on',x==='inn')),renderLogin()):renderArter()})();
</script></body></html>
