<!DOCTYPE html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jaktlogg</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#eef1ec;color:#1f2a1f}
.app{max-width:390px;margin:0 auto;min-height:100vh;background:#fff;padding:16px 16px 80px;position:relative}
h1{margin:0 0 4px;color:#2f5d34;font-size:26px}h2{font-size:16px;margin:18px 0 8px;display:flex;justify-content:space-between}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:#2f5d34;color:#fff;font-size:16px;cursor:pointer}
.danger{background:#a33}.sec{background:#888}
label{display:block;font-size:14px;font-weight:600;margin-top:12px}
input,select,textarea{width:100%;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:8px;margin-top:4px;font-family:inherit}
#preview{width:100%;max-height:220px;object-fit:cover;border-radius:8px;display:none;margin-top:8px}
.empty{text-align:center;color:#667;padding:40px 10px;border:2px dashed #ccd;border-radius:12px;margin:16px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border-radius:10px;overflow:hidden;background:#f4f6f2;cursor:pointer}
.card img,.ph{width:100%;height:110px;object-fit:cover;display:block;background:#cfd8c8}.card div{padding:6px 8px;font-size:14px}.card small{color:#667}
.cnt{background:#2f5d34;color:#fff;border-radius:10px;padding:1px 8px;font-size:13px}
.seg{display:flex;background:#e4e9e0;border-radius:10px;padding:3px;margin-top:10px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:14px}.seg .on{background:#fff;font-weight:600}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;display:flex;background:#fff;border-top:1px solid #ddd}
.tabs button{flex:1;border:0;background:none;padding:12px;font-size:15px;color:#667}.tabs .on{color:#2f5d34;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:390px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}.sheet img{width:100%;border-radius:8px}
.hide{display:none}.muted{color:#667;font-size:14px}
</style></head><body><div class="app">
<h1>Jaktlogg</h1>
<section id="s-ny">
<div class="muted">Ny fangst</div>
<form id="f">
<label>Bilde<input type="file" id="photo" accept="image/*"></label><img id="preview" alt="Forhåndsvisning">
<label>Art<select id="species"></select></label>
<input id="other" class="hide" placeholder="Skriv art">
<label>Dato<input type="date" id="date" required></label>
<label>Jaktområde (valgfritt)<input id="area" placeholder="f.eks. Trollheimen"></label>
<label>Notater (valgfritt)<textarea id="notes" rows="3"></textarea></label>
<button class="btn" style="margin-top:16px">Lagre</button>
</form></section>
<section id="s-oversikt" class="hide">
<label>Sesong<select id="season"></select></label>
<div class="seg"><button id="g-art" class="on">Per art</button><button id="g-mnd">Per måned</button></div>
<div id="list"></div></section>
<nav class="tabs"><button id="t-ny" class="on">+ Ny fangst</button><button id="t-oversikt">Oversikt</button></nav>
</div>
<div class="modal" id="m"><div class="sheet" id="detail"></div></div>
<script>
const K='jaktlogg.entries',$=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const ARTER=['Elg','Hjort','Rådyr','Villrein','Rype','Hare','Storfugl','Orrfugl','Jerpe','Rev','Gaupe','Ender','Gjess','Annet'];
const MND=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
let photo='',group='art';
const load=()=>JSON.parse(localStorage.getItem(K)||'[]'),save=a=>localStorage.setItem(K,JSON.stringify(a));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
// Sesong: 1. august – 31. juli
const seasonOf=d=>{const[y,m]=d.split('-').map(Number);return m>=8?y:y-1};
const fmt=d=>d.split('-').reverse().join('.');
$('species').innerHTML=ARTER.map(a=>`<option>${a}</option>`).join('');
$('species').onchange=()=>$('other').classList.toggle('hide',$('species').value!=='Annet');
function show(t){['ny','oversikt'].forEach(x=>{$('s-'+x).classList.toggle('hide',x!==t);$('t-'+x).classList.toggle('on',x===t)});if(t==='oversikt')render()}
$('t-ny').onclick=()=>show('ny');$('t-oversikt').onclick=()=>show('oversikt');
$('g-art').onclick=()=>{group='art';render()};$('g-mnd').onclick=()=>{group='mnd';render()};
function seasons(){const s=new Set(load().map(e=>seasonOf(e.date)));s.add(seasonOf(today()));return[...s].sort((a,b)=>b-a)}
function render(){
 const cur=$('season').value;$('season').innerHTML=seasons().map(y=>`<option value="${y}">${y}/${String(y+1).slice(2)} (aug–jul)</option>`).join('');
 if(cur&&[...$('season').options].some(o=>o.value===cur))$('season').value=cur;
 $('g-art').classList.toggle('on',group==='art');$('g-mnd').classList.toggle('on',group==='mnd');
 const y=+$('season').value,e=load().filter(x=>seasonOf(x.date)===y).sort((a,b)=>b.date.localeCompare(a.date));
 if(!e.length){$('list').innerHTML=`<div class="empty">Ingen fangster logget i sesongen ${y}/${String(y+1).slice(2)} ennå</div>`;return}
 const g={};e.forEach(x=>{const k=group==='art'?x.species:x.date.slice(0,7);(g[k]=g[k]||[]).push(x)});
 let keys=Object.keys(g);keys.sort(group==='art'?(a,b)=>g[b].length-g[a].length||a.localeCompare(b,'no'):(a,b)=>a.localeCompare(b));
 $('list').innerHTML=keys.map(k=>{const t=group==='art'?k:(m=>MND[+m[1]-1][0].toUpperCase()+MND[+m[1]-1].slice(1)+' '+m[0])(k.split('-'));
  return `<h2>${esc(t)} <span class="cnt">${g[k].length}</span></h2><div class="grid">`+g[k].map(x=>`<div class="card" data-id="${x.id}">${x.photo?`<img src="${x.photo}" alt="">`:'<div class="ph"></div>'}<div><b>${esc(x.species)}</b><br><small>${fmt(x.date)}</small></div></div>`).join('')+'</div>'}).join('');
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>detail(c.dataset.id));
}
function detail(id){const x=load().find(e=>e.id===id);if(!x)return;
 $('detail').innerHTML=`${x.photo?`<img src="${x.photo}" alt="">`:''}<h2>${esc(x.species)}</h2><p>Dato: ${fmt(x.date)}</p><p>Jaktområde: ${esc(x.area)||'–'}</p><p>Notater: ${esc(x.notes)||'–'}</p>
 <button class="btn danger" id="del">Slett fangst</button><button class="btn sec" id="close" style="margin-top:8px">Lukk</button>`;
 $('m').classList.add('open');$('close').onclick=()=>$('m').classList.remove('open');
 $('del').onclick=()=>{if(confirm('Slette denne fangsten?')){save(load().filter(e=>e.id!==id));$('m').classList.remove('open');render()}}}
$('m').onclick=e=>{if(e.target.id==='m')$('m').classList.remove('open')};
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1200/Math.max(i.width,i.height));c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.75);$('preview').src=photo;$('preview').style.display='block'};i.src=r.result};r.readAsDataURL(f)};
function resetForm(){$('f').reset();photo='';$('preview').style.display='none';$('other').classList.add('hide');$('date').value=today()}
$('f').onsubmit=ev=>{ev.preventDefault();let sp=$('species').value;if(sp==='Annet'){sp=$('other').value.trim();if(!sp){alert('Skriv inn art.');return}}
 const a=load();a.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),species:sp,date:$('date').value,area:$('area').value.trim(),notes:$('notes').value.trim(),photo});
 try{save(a)}catch(err){alert('Lagringsplassen i nettleseren er full. Slett noen fangster og prøv igjen.');return}
 resetForm();$('season').value=String(seasonOf(a[a.length-1].date));show('oversikt')};
resetForm();
</script></body></html>
